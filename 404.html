<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="robots" content="noindex" />
  <link rel="icon" href="images/logo/paraiso-mark.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/tokens.css?v=2" />
  <link rel="stylesheet" href="css/base.css?v=2" />
  <link rel="stylesheet" href="css/layout.css?v=2" />
  <link rel="stylesheet" href="css/components.css?v=2" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-6);
    }
    .error-page__code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 12vw, 7rem);
      color: var(--accent-500);
      line-height: 1;
    }
    .error-page__actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      justify-content: center;
      margin-top: var(--space-7);
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <img src="images/logo/paraiso-mark.png" alt="" width="140" height="52" style="margin-inline:auto; margin-bottom: var(--space-6);" />
      <p class="error-page__code">404</p>
      <h1>Essa página não existe</h1>
      <p class="lead" style="margin-top: var(--space-4); max-width: 28rem; margin-inline: auto;">

      </p>
      <div class="error-page__actions">
        <a class="btn btn--primary" href="index.html">Voltar ao início</a>
        <a class="btn btn--ghost" id="cta-404-whatsapp" href="https://wa.me/5511953749949" target="_blank" rel="noopener">Falar no WhatsApp</a>

    </div>
